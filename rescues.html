<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CACC Rescue Partners</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --border: #30363d; --accent: #58a6ff; --row: #161b22; --row-hover: #21262d; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1, h2 { color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-top: 40px; }
        .stats { background: var(--row); padding: 15px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 30px; display: flex; gap: 20px; font-size: 1.1em; }
        .controls { background: var(--row); padding: 15px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .control-group { display: flex; flex-direction: column; }
        .control-group label { font-size: 0.85em; margin-bottom: 5px; color: #8b949e; }
        .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
        th { background: var(--row); padding: 12px 15px; border-bottom: 2px solid var(--border); color: var(--text); white-space: nowrap; cursor: pointer; }
        td { padding: 12px 15px; border-bottom: 1px solid var(--border); }
        tr:nth-child(even) { background-color: var(--row); }
        tr:hover { background-color: var(--row-hover); }
        a { color: var(--accent); text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
        .footer { margin-top: 50px; color: #8b949e; font-size: 12px; text-align: center; }
        input, button { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        .nav { margin-bottom: 20px; }
        .chart-container { background: #161b22; padding: 20px; border-radius: 6px; border: 1px solid #30363d; height: 500px; margin-bottom: 30px; position: relative; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚑 CACC Rescue Partners</h1>
        <div class="nav">
            <a href="index.html">🐕 Dashboard</a> | 
            <a href="map.html">🗺️ Location Map</a> |
            <strong>🚑 Rescue Stats</strong> |
            <a href="breeds.html">🐶 Breeds</a>
        </div>
        
        <div class="stats">
            <div><strong>Updated:</strong> 2025-11-28 11:42 CST</div>
            <div id="total-stat"><strong>Total Rescues (Range):</strong> 0</div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="start-date">From:</label>
                <input type="date" id="start-date">
            </div>
            <div class="control-group">
                <label for="end-date">To:</label>
                <input type="date" id="end-date">
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <button onclick="updateDashboard()" style="cursor: pointer; background: var(--accent); color: #000; font-weight: bold; border: none; margin-top: auto;">Update Report</button>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="partnerChart"></canvas>
        </div>

        <h2>📋 Partner Breakdown</h2>
        <input type='text' id='searchRescue' onkeyup='searchTable()' placeholder='Search partners...'>
        <br><br>
        
        <div class='table-container'>
            <table id='rescue_tbl'>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Rescue Partner</th>
                        <th>Dogs Rescued</th>
                        <th>Top Breeds</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>

        <div class="footer">Generated by CACC Dog Bot</div>
    </div>

    <script>
        // 1. Embed Raw Data from Python
        const rawData = [{"breed": "American Pit Bull Terrier", "date": "2025-11-24", "partner": "Tails Together Co"}, {"breed": "German Shepherd Dog", "date": "2025-11-23", "partner": "Mit Liebe German Shepherd Dog Rescue"}, {"breed": "American Pit Bull Terrier", "date": "2025-11-25", "partner": "Heartland Animal Shelter"}, {"breed": "American Pit Bull Terrier and American Staffordshire Terrier", "date": "2025-11-21", "partner": "Dark Horse Dogs, Nfp"}, {"breed": "Labrador Retriever", "date": "2025-11-26", "partner": "One Tail At A Time"}, {"breed": "Belgian Malinois", "date": "2025-11-20", "partner": "Midwest Working Dog Rescue"}, {"breed": "German Shepherd Dog", "date": "2025-11-21", "partner": "German Shepherd Rescue Inc."}, {"breed": "Doberman Pinscher", "date": "2025-11-20", "partner": "Il Doberman Rescue Plus"}, {"breed": "Miniature Pinscher", "date": "2025-11-25", "partner": "Tails Together Co"}, {"breed": "American Pit Bull Terrier", "date": "2025-11-20", "partner": "Border Tails Rescue"}, {"breed": "Pomeranian", "date": "2025-11-20", "partner": "Border Tails Rescue"}, {"breed": "Great Dane", "date": "2025-11-20", "partner": "Chicago Rescue Authority"}, {"breed": "Golden Retriever", "date": "2025-11-20", "partner": "As Good As Gold"}, {"breed": "English Bulldog and American Pit Bull Terrier", "date": "2025-11-20", "partner": "Border Tails Rescue"}, {"breed": "Collie - Smooth", "date": "2025-11-20", "partner": "Border Tails Rescue"}, {"breed": "Poodle - Toy", "date": "2025-11-23", "partner": "Pet Profile Rescue"}, {"breed": "Poodle - Toy", "date": "2025-11-23", "partner": "Pet Profile Rescue"}, {"breed": "Shih Tzu", "date": "2025-11-24", "partner": "Border Tails Rescue"}, {"breed": "Chihuahua - Smooth Coated", "date": "2025-11-21", "partner": "Paws Chicago"}, {"breed": "American Pit Bull Terrier", "date": "2025-11-24", "partner": "Border Tails Rescue"}, {"breed": "Poodle - Miniature", "date": "2025-11-21", "partner": "Paws Of Tinley Park"}, {"breed": "Chinese Sharpei", "date": "2025-11-21", "partner": "Anti Cruelty Society"}, {"breed": "Shih Tzu", "date": "2025-11-27", "partner": "One More Dog Rescue Inc"}, {"breed": "Chihuahua - Smooth Coated", "date": "2025-11-24", "partner": "Border Tails Rescue"}, {"breed": "Border Collie", "date": "2025-11-22", "partner": "Garrido Stray Rescue Foundation"}, {"breed": "Poodle - Standard", "date": "2025-11-22", "partner": "Garrido Stray Rescue Foundation"}, {"breed": "Yorkshire Terrier", "date": "2025-11-27", "partner": "One More Dog Rescue Inc"}, {"breed": "American Pit Bull Terrier", "date": "2025-11-26", "partner": "One Tail At A Time"}, {"breed": "Pomeranian", "date": "2025-11-26", "partner": "One More Dog Rescue Inc"}, {"breed": "American Pit Bull Terrier", "date": "2025-11-25", "partner": "It\u0027S A Pittie Rescue"}, {"breed": "American Pit Bull Terrier", "date": "2025-11-25", "partner": "It\u0027S A Pittie Rescue"}, {"breed": "American Pit Bull Terrier", "date": "2025-11-23", "partner": "Mission Compassion Paw Inc (Mcp)"}];
        let chartInstance = null;

        // 2. Initialize Dates (Default: Last 30 Days)
        window.onload = function() {
            const today = new Date();
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(today.getDate() - 30);

            document.getElementById('end-date').valueAsDate = today;
            document.getElementById('start-date').valueAsDate = thirtyDaysAgo;

            updateDashboard();
        };

        // 3. Main Update Logic
        function updateDashboard() {
            const startDate = new Date(document.getElementById('start-date').value);
            const endDate = new Date(document.getElementById('end-date').value);
            // End date should include the full day
            endDate.setHours(23, 59, 59, 999);

            // Filter Data
            const filtered = rawData.filter(d => {
                if (!d.date) return false;
                const date = new Date(d.date);
                return date >= startDate && date <= endDate;
            });

            // Aggregate Data
            const partnerStats = {};
            filtered.forEach(row => {
                const p = row.partner;
                if (!partnerStats[p]) {
                    partnerStats[p] = { count: 0, breeds: {} };
                }
                partnerStats[p].count++;
                
                const b = row.breed || "Unknown";
                partnerStats[p].breeds[b] = (partnerStats[p].breeds[b] || 0) + 1;
            });

            // Convert to Array and Sort
            const sortedPartners = Object.entries(partnerStats)
                .map(([name, data]) => ({
                    name: name,
                    count: data.count,
                    breeds: data.breeds
                }))
                .sort((a, b) => b.count - a.count);

            // Update Stats Header
            document.getElementById('total-stat').innerHTML = `<strong>Total Rescues (Range):</strong> ${filtered.length}`;

            // Update UI Components
            renderChart(sortedPartners.slice(0, 15)); // Top 15 for chart
            renderTable(sortedPartners);
        }

        // 4. Render Chart (Chart.js)
        function renderChart(topPartners) {
            const ctx = document.getElementById('partnerChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: topPartners.map(p => p.name),
                    datasets: [{
                        label: 'Dogs Rescued',
                        data: topPartners.map(p => p.count),
                        backgroundColor: '#58a6ff',
                        borderColor: '#0d1117',
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: 'Top 15 Rescue Partners (Selected Range)', color: '#c9d1d9', font: { size: 16 } }
                    },
                    scales: {
                        x: { 
                            ticks: { color: '#8b949e' },
                            grid: { color: '#30363d' }
                        },
                        y: { 
                            ticks: { color: '#c9d1d9' },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // 5. Render Table
        function renderTable(partners) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (partners.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">No data found for this date range.</td></tr>';
                return;
            }

            partners.forEach((p, index) => {
                // Sort Top 3 Breeds
                const topBreeds = Object.entries(p.breeds)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 3)
                    .map(([breed, count]) => `${breed} (${count})`)
                    .join(', ');

                const row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td style="font-weight:bold; color: #58a6ff;">${p.name}</td>
                        <td>${p.count}</td>
                        <td style="color: #8b949e; font-size: 0.9em;">${topBreeds}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // 6. Search Filter
        function searchTable() {
            const input = document.getElementById("searchRescue");
            const filter = input.value.toUpperCase();
            const table = document.getElementById("rescue_tbl");
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) { // Skip header
                const td = tr[i].getElementsByTagName("td")[1]; // Partner Name col
                if (td) {
                    const txtValue = td.textContent || td.innerText;
                    tr[i].style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
                }
            }
        }
    </script>
</body>
</html>
