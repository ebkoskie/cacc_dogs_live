        document.body.classList.toggle('light-mode');

ated with CACC · Data "as is" — verify with CACC · <a href=terms.html>Terms</a> · <a href=privacy.html>Privacy</a></div><script>
    // Optimization: Debounce Utility (Local scope since we don't extend base.html)
    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            const context = this;
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(context, args), wait);
        };
    }

    // Optimization: "Just-in-Time" Connection Warmer
    // Adapted for Map: Triggers preconnect to 24PetConnect on pin hover/tap
    (function() {
        let pcWarmed = false;

        function warmConnection() {
            if (pcWarmed) return;
            const link = document.createElement('link');
            link.rel = 'preconnect';
            link.href = 'https://24petconnect.com';
            // No crossorigin needed for simple navigation
            document.head.appendChild(link);
            pcWarmed = true;
        }

        const handleInteraction = (e) => {
            // Check if we are hovering/touching a link inside a Leaflet popup
            const link = e.target.closest('a[href*="24petconnect.com"]');
            if (!pcWarmed && link) {
                warmConnection();
            }
        };

        document.addEventListener('mouseover', handleInteraction, { passive: true });
        document.addEventListener('touchstart', handleInteraction, { passive: true });
    })();

    // Global State
    let mapObj = null;
    let dogCluster = null;
    let markerIndex = {}; 
    let mapDogData = [];

    // 1. Load Compressed Data
    fetch('map_data.json')
        .then(response => response.json())
        .then(payload => {
            // HYDRATION: Convert Array-of-Arrays back to Objects for the map logic
            // Schema: [id, name, breed_idx, gender_idx, lat, lon, found_at, intake_date]
            mapDogData = payload.data.map(row => ({
                id: row[0],
                name: row[1],
                breed: payload.b[row[2]] || "Unknown",
                gender: payload.g[row[3]] || "Unknown",
                coords: [row[4], row[5]],
                found_at: row[6],
                intake_date: row[7] || "",
                url: `https://24petconnect.com/chgoall/Details/CHGO/${row[0]}`
            }));
            
            console.log(`✅ Data: Loaded ${mapDogData.length} records.`);
            // No initMapLayer call here; we rely on the interval below to detect when Folium is ready
        })
        .catch(err => console.error("Failed to load map data:", err));

    // 2. Wait for Folium Map
    const initInterval = setInterval(() => {
        for(let key in window) {
            if (window[key] instanceof L.Map) {
                mapObj = window[key];
                break;
            }
        }
        // Only render if map exists AND data is loaded
        if (mapObj && mapDogData.length > 0) {
            clearInterval(initInterval);
            renderPins();
        }
    }, 100);
    // Safety: stop polling after 15s to prevent infinite loop if map fails to load
    setTimeout(() => clearInterval(initInterval), 15000);

    // 3. Render Pins
    function renderPins() {
        console.time("RenderPins");
        dogCluster = L.markerClusterGroup({ maxClusterRadius: 50, spiderfyOnMaxZoom: true, showCoverageOnHover: false });

        mapDogData.forEach(dog => {
            const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${dog.coords[0]},${dog.coords[1]}`;
            const popupHtml = `
                <div style="width:200px; font-family: sans-serif;">
                    <b style="font-size:1.1em">
                        <a href="${dog.url}" rel="noopener noreferrer" style="text-decoration:none; color:#0969da;">${dog.name}</a>
                    </b>
                    <span style="color:#666; font-size:0.9em">(${dog.id})</span><br>
                    <div style="margin-top:4px; font-size:0.9em; color:#333;">
                        ${dog.breed}<br>
                        ${dog.gender}<br>
                        ${dog.intake_date ? `Intake: ${dog.intake_date}<br>` : ''}
                        <i style="color:#555; display:block; margin-top:4px; font-size:0.85em">${dog.found_at}</i>
                        <a href="${streetViewUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-block; margin-top:6px; font-size:0.85em; color:#0969da; text-decoration:none;">📍 Street View</a>
                    </div>
                </div>`;

            const icon = L.AwesomeMarkers.icon({ icon: 'paw', prefix: 'fa', markerColor: 'blue', iconColor: 'white' });
            const marker = L.marker(dog.coords, { icon: icon }).bindPopup(popupHtml);

            dogCluster.addLayer(marker);
            markerIndex[dog.id] = marker;
        });

        mapObj.addLayer(dogCluster);
        console.timeEnd("RenderPins");
        enableUI();
    }

    function enableUI() {
        document.getElementById('mapSearch').disabled = false;
        ['btnLocate', 'btnRecenter', 'btnLayers'].forEach(id => {
            document.getElementById(id).disabled = false;
        });

        discoverBaseLayers();
        setupToolbar();
        setupLayers();

        const urlParams = new URLSearchParams(window.location.search);
        const dogId = urlParams.get('id');
        if (dogId) focusDog(dogId);
    }

    // --- Map layer references (discovered from the Folium-generated map) ---
    let heatLayer = null;       // Folium HeatMap (L.HeatLayer)
    let baseTileLayer = null;   // The CartoDB dark base tiles
    let satLayer = null;        // Lazily-created Esri satellite tiles
    let pinsOnMap = true;

    function discoverBaseLayers() {
        mapObj.eachLayer(layer => {
            if (typeof L.HeatLayer !== 'undefined' && layer instanceof L.HeatLayer) {
                heatLayer = layer;
            } else if (layer instanceof L.TileLayer && !baseTileLayer) {
                baseTileLayer = layer;
            }
        });
        // If no heat layer exists, hide its toggle
        if (!heatLayer) document.getElementById('rowHeat').style.display = 'none';
    }

    // --- Toast helper (geolocation errors, etc.) ---
    let toastTimer = null;
    function showToast(msg) {
        const t = document.getElementById('mapToast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // --- Toolbar: locate, recenter, layers ---
    let locateMarker = null;
    function setupToolbar() {
        const btnLocate = document.getElementById('btnLocate');
        const btnRecenter = document.getElementById('btnRecenter');
        const btnLayers = document.getElementById('btnLayers');
        const layersPanel = document.getElementById('layersPanel');

        btnLocate.addEventListener('click', () => {
            if (!navigator.geolocation) { showToast('Location is not supported on this device.'); return; }
            btnLocate.classList.add('active');
            navigator.geolocation.getCurrentPosition(
                pos => {
                    btnLocate.classList.remove('active');
                    const ll = [pos.coords.latitude, pos.coords.longitude];
                    if (locateMarker) mapObj.removeLayer(locateMarker);
                    locateMarker = L.circleMarker(ll, {
                        radius: 8, color: '#41B6E6', fillColor: '#41B6E6', fillOpacity: 0.6, weight: 2
                    }).bindPopup('You are here').addTo(mapObj);
                    mapObj.flyTo(ll, 14);
                },
                err => {
                    btnLocate.classList.remove('active');
                    showToast(err.code === err.PERMISSION_DENIED
                        ? 'Location permission denied.'
                        : 'Could not determine your location.');
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
            );
        });

        btnRecenter.addEventListener('click', () => {
            mapObj.flyTo([41.8781, -87.6298], 11);
            if (locateMarker) { mapObj.removeLayer(locateMarker); locateMarker = null; }
            clearSearch();
        });

        // Toggle the layers popover; close on outside click
        btnLayers.addEventListener('click', (e) => {
            e.stopPropagation();
            const open = layersPanel.classList.toggle('open');
            btnLayers.classList.toggle('active', open);
            btnLayers.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        document.addEventListener('click', (e) => {
            if (!layersPanel.contains(e.target) && e.target !== btnLayers) {
                layersPanel.classList.remove('open');
                btnLayers.classList.remove('active');
                btnLayers.setAttribute('aria-expanded', 'false');
            }
        });
    }

    // --- Layer toggles + base map switch + 311 layer ---
    function setupLayers() {
        const togglePins = document.getElementById('togglePins');
        const toggleHeat = document.getElementById('toggleHeat');
        const toggle311 = document.getElementById('toggle311');
        const baseDark = document.getElementById('baseDark');
        const baseSat = document.getElementById('baseSat');

        togglePins.addEventListener('change', () => {
            if (togglePins.checked) { if (!pinsOnMap) { mapObj.addLayer(dogCluster); pinsOnMap = true; } }
            else { if (pinsOnMap) { mapObj.removeLayer(dogCluster); pinsOnMap = false; } }
        });

        toggleHeat.addEventListener('change', () => {
            if (!heatLayer) return;
            if (toggleHeat.checked) mapObj.addLayer(heatLayer);
            else mapObj.removeLayer(heatLayer);
        });

        baseDark.addEventListener('change', () => {
            if (satLayer && mapObj.hasLayer(satLayer)) mapObj.removeLayer(satLayer);
        });
        baseSat.addEventListener('change', () => {
            if (!satLayer) {
                satLayer = L.tileLayer(
                    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                    // zIndex 2 keeps it above the dark base tiles but still below markers/heat
                    { attribution: 'Tiles &copy; Esri', maxZoom: 19, zIndex: 2 }
                );
            }
            if (!mapObj.hasLayer(satLayer)) satLayer.addTo(mapObj);
        });

        toggle311.addEventListener('change', () => {
            if (toggle311.checked) {
                enable311();
            } else {
                if (stray311Layer) mapObj.removeLayer(stray311Layer);
                document.getElementById('timeframe311').style.display = 'none';
            }
        });

        // Timeframe segmented control (filters the baked snapshot client-side)
        const seg311 = document.getElementById('seg311');
        seg311.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-days]');
            if (!btn) return;
            stray311Days = parseInt(btn.dataset.days, 10);
            seg311.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
            if (stray311Loaded && stray311AllRows.length) render311();
        });
    }

    // 4. Action Logic
    function focusDog(dogId) {
        const dogInfo = mapDogData.find(d => String(d.id) === String(dogId));
        if (!dogInfo) { showToast(`Could not locate Dog ${dogId}.`); return; }

        document.getElementById('mapSearch').value = `${dogInfo.name} (${dogInfo.id})`;
        updateClearVisibility();
        const marker = markerIndex[dogId];
        
        if (marker) {
            dogCluster.zoomToShowLayer(marker, function() { marker.openPopup(); });
        } else {
            mapObj.flyTo(dogInfo.coords, 18);
        }
    }

    // 5a. 311 Stray Complaints layer (loaded from the build-time baked snapshot).
    // NOTE: we can't call Open311 live from the browser — its https cert is invalid
    // (ERR_CERT_COMMON_NAME_INVALID) and http would be blocked as mixed content. The
    // snapshot (stray311.json) is refreshed server-side on each build instead. It holds
    // up to 30 days; the user narrows the window client-side via the segmented control.
    let stray311Layer = null;
    let stray311Loaded = false;
    let stray311AllRows = [];     // full baked superset (up to 90 days)
    let stray311Updated = '';     // ISO timestamp of the snapshot build
    let stray311Days = 1;         // current timeframe selection (default 24h)

    // Touch/stylus pointers can't hit a 7px circle reliably — these markers were a
    // measured rageclick source. Fingers get a bigger dot and a thicker ring.
    const COARSE_POINTER = window.matchMedia('(pointer: coarse)').matches;

    // Escape free-text 311 fields (user-submitted) before injecting into popup HTML
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function makeStray311Markers(rows) {
        const group = L.layerGroup();
        rows.forEach(r => {
            // Schema: [id, lat, long, requested_datetime, address, media_url, status, animal_desc, confined, updated_datetime]
            const lat = r[1], lon = r[2];
            if (lat == null || lon == null) return;
            const sv = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}`;
            const opened = formatLocal(r[3]);
            const status = r[6] ? r[6].charAt(0).toUpperCase() + r[6].slice(1) : '';
            const statusLine = status ? `<span style="color:#555;">Status: <b>${esc(status)}</b></span><br>` : '';
            // updated_datetime is the close date when the request is closed
            const isClosed = (r[6] || '').toLowerCase() === 'closed';
            const closedLine = (isClosed && r[9]) ? `<span style="color:#555;">Closed: ${esc(formatLocal(r[9]))}</span><br>` : '';
            const animalLine = r[7] ? `<div style="margin-top:4px;">🐾 ${esc(r[7])}</div>` : '';
            const confinedLine = r[8] ? `<div style="color:#555; font-size:0.85em;">Confined: ${esc(r[8])}</div>` : '';
            const thumb = r[5] ? `<a href="${encodeURI(r[5])}" target="_blank" rel="noopener noreferrer"><img class="sr-thumb" src="${encodeURI(r[5])}" alt="311 report photo" loading="lazy"></a>` : '';
            const popup = `
                <div style="width:210px; font-family: sans-serif;">
                    <b style="font-size:1em">Stray Animal Complaint</b><br>
                    <div style="margin-top:4px; font-size:0.9em; color:#333;">
                        <span style="color:#555;">Opened: ${esc(opened)}</span><br>
                        ${statusLine}
                        ${closedLine}
                        ${esc(r[4] || '')}
                        ${animalLine}
                        ${confinedLine}
                        <a href="${sv}" target="_blank" rel="noopener noreferrer" style="display:inline-block; margin-top:6px; font-size:0.85em; color:#0969da; text-decoration:none;">📍 Street View</a>
                        ${thumb}
                    </div>
                </div>`;
            L.circleMarker([lat, lon], {
                radius: COARSE_POINTER ? 11 : 8, color: '#FDB81E', fillColor: '#F9C642',
                fillOpacity: 0.7, weight: COARSE_POINTER ? 3 : 2
            }).bindPopup(popup).addTo(group);
        });
        return group;
    }

    function formatLocal(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return isNaN(d) ? iso : d.toLocaleString();
    }

    // Filter the baked superset to the selected timeframe and (re)draw the layer
    function render311() {
        const toggle311 = document.getElementById('toggle311');
        const wasOn = stray311Layer && mapObj.hasLayer(stray311Layer);
        if (stray311Layer) mapObj.removeLayer(stray311Layer);

        const cutoff = Date.now() - stray311Days * 864e5;
        const rows = stray311AllRows.filter(r => {
            const t = r[3] ? new Date(r[3]).getTime() : NaN;
            return isNaN(t) ? true : t >= cutoff; // keep undated rows rather than drop data
        });

        stray311Layer = makeStray311Markers(rows);
        if (toggle311.checked || wasOn) mapObj.addLayer(stray311Layer);

        const n = rows.length;
        document.getElementById('caption311').textContent =
            `${n} report${n === 1 ? '' : 's'} · updated ${formatLocal(stray311Updated)}`;
    }

    function enable311() {
        // Already loaded once — just re-filter/redraw and show the timeframe control
        if (stray311Loaded) {
            if (stray311AllRows.length) {
                document.getElementById('timeframe311').style.display = 'block';
                render311();
            } else {
                hide311Row();
            }
            return;
        }
        stray311Loaded = true;

        fetch('stray311.json')
            .then(r => r.ok ? r.json() : Promise.reject('no snapshot'))
            .then(snap => {
                stray311AllRows = (snap && snap.data) || [];
                stray311Updated = (snap && snap.updated) || '';
                if (!stray311AllRows.length) { hide311Row(); return; }
                document.getElementById('timeframe311').style.display = 'block';
                render311();
            })
            .catch(() => hide311Row());
    }

    function hide311Row() {
        document.getElementById('toggle311').checked = false;
        document.getElementById('row311').style.display = 'none';
        document.getElementById('caption311').style.display = 'none';
        document.getElementById('timeframe311').style.display = 'none';
    }

    // 5b. Search Bar Logic (clear button, keyboard nav, result count)
    const searchInput = document.getElementById('mapSearch');
    const resultsDiv = document.getElementById('mapSearchResults');
    const clearBtn = document.getElementById('mapSearchClear');
    let activeIndex = -1; // highlighted result for keyboard nav

    function updateClearVisibility() {
        clearBtn.style.display = searchInput.value.length ? 'block' : 'none';
    }

    function hideResults() {
        resultsDiv.style.display = 'none';
        resultsDiv.innerHTML = '';
        activeIndex = -1;
    }

    function clearSearch() {
        searchInput.value = '';
        updateClearVisibility();
        hideResults();
        if (locateMarker) { mapObj.removeLayer(locateMarker); locateMarker = null; }
    }

    clearBtn.addEventListener('click', () => { clearSearch(); searchInput.focus(); });

    // Debounced filtering on input
    const handleMapSearch = debounce(function() {
        updateClearVisibility();
        const filter = searchInput.value.trim().toUpperCase();
        resultsDiv.innerHTML = '';
        activeIndex = -1;

        if (filter.length < 2) { hideResults(); return; }

        const matches = mapDogData.filter(dog =>
            dog.name.toUpperCase().includes(filter) || String(dog.id).includes(filter)
        );

        if (!matches.length) { hideResults(); return; }

        resultsDiv.style.display = 'block';
        const shown = matches.slice(0, 8);

        const count = document.createElement('div');
        count.className = 'search-result-count';
        count.textContent = matches.length > shown.length
            ? `Showing ${shown.length} of ${matches.length}`
            : `${matches.length} match${matches.length === 1 ? '' : 'es'}`;
        resultsDiv.appendChild(count);

        shown.forEach(dog => {
            const div = document.createElement('div');
            div.className = 'search-result-item';
            div.innerText = `${dog.name} (${dog.id})`;
            div.dataset.id = dog.id;
            div.onclick = () => { focusDog(dog.id); hideResults(); };
            resultsDiv.appendChild(div);
        });
    }, 300);

    searchInput.addEventListener('input', handleMapSearch);

    // Keyboard navigation (arrows / enter / escape) — not debounced
    searchInput.addEventListener('keydown', (e) => {
        const items = Array.from(resultsDiv.querySelectorAll('.search-result-item'));
        if (e.key === 'Escape') { hideResults(); return; }
        if (!items.length) {
            if (e.key === 'Enter') {
                // No dropdown open; jump to first match if any
                const filter = searchInput.value.trim().toUpperCase();
                const m = mapDogData.find(d => d.name.toUpperCase().includes(filter) || String(d.id).includes(filter));
                if (m) { focusDog(m.id); hideResults(); }
            }
            return;
        }
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = (activeIndex + 1) % items.length;
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = (activeIndex - 1 + items.length) % items.length;
        } else if (e.key === 'Enter') {
            e.preventDefault();
            const target = activeIndex >= 0 ? items[activeIndex] : items[0];
            if (target) { focusDog(target.dataset.id); hideResults(); }
            return;
        } else {
            return;
        }
        items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
        if (activeIndex >= 0) items[activeIndex].scrollIntoView({ block: 'nearest' });
    });
