    function findMapComponents() {

    function focusDog(dogId) {
        if (!clusterGroup || !mapObj) return;

        // Populate search box for clarity

            // Handle case where content is an HTMLElement instead of string
            if (typeof content !== 'string' && content.innerHTML) {
                content = content.innerHTML;
            }
            return content && content.includes(`id="marker-dog-${dogId}"`);

            });
