    // 2. Global State
    let mapObj = null;
    let clusterGroup = null;
    let markerIndex = {}; // FAST Lookup: { "A123": MarkerObject }

    // 3. Fast Initialization Loop
    let initAttempts = 0;
    const initInterval = setInterval(() => {
        findMapComponents();
        
        if (mapObj && clusterGroup) {
            // Check if Leaflet has actually processed the markers
            if (clusterGroup.getLayers().length > 0) {
                console.log("✅ CACC Map: Components ready. Building Index...");
                clearInterval(initInterval);
                
                // PERFORMANCE: Build the index once so clicks are instant
                buildMarkerIndex();
                
                // Execute Deep Link
                checkUrlParams(); 
                return;
            }
        }
        
        initAttempts++;
        if (initAttempts > 50) { // 5 seconds timeout (100ms * 50)
            console.warn("⚠️ CACC Map: Timeout waiting for markers.");
            clearInterval(initInterval);
            // Attempt to run anyway (will hit coordinate fallback)
            if (mapObj) checkUrlParams();
        }
    }, 100); // Check every 100ms for instant feel

    function findMapComponents() {
        for(let key in window) {
            if (window[key] instanceof L.Map) {
                mapObj = window[key];
                break;
            }
        }
        if (mapObj) {
            mapObj.eachLayer(function(layer) {
                if (layer.zoomToShowLayer && layer.getAllChildMarkers) {
                    clusterGroup = layer;
                }
            });
        }
    }

    // 4. The Indexer (Runs Once)
    function buildMarkerIndex() {
        if (!clusterGroup) return;
        
        console.time("Indexing Markers");
        const markers = clusterGroup.getAllChildMarkers();
        
        markers.forEach(marker => {
            const popup = marker.getPopup();
            if (popup) {
                let content = popup.getContent();
                // Normalize content to string
                if (typeof content !== 'string' && content.innerHTML) {
                    content = content.innerHTML;
                }
                
                // FAST Regex extraction
                // Looks for: id="marker-dog-A123" or id='marker-dog-A123'
                const match = content.match(/id=["']marker-dog-([^"']+)["']/);
                if (match && match[1]) {
                    markerIndex[match[1]] = marker;
                }
            }
        });
        console.timeEnd("Indexing Markers");
        console.log(`📚 Indexed ${Object.keys(markerIndex).length} dogs.`);
    }

    // 5. Deep Linking & Action Logic
    function checkUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const dogId = urlParams.get('id');
        if (dogId) {
            focusDog(dogId);
        }
    }

    function focusDog(dogId) {
        if (!mapObj) return;

        // 1. Update UI
        const dogInfo = mapDogData.find(d => String(d.id) === String(dogId));
        if (dogInfo) {
            document.getElementById('mapSearch').value = `${dogInfo.name} (${dogInfo.id})`;
        } else {
            console.warn("Dog ID not found in data:", dogId);
        }

        // 2. Instant Lookup (O(1))
        const targetMarker = markerIndex[dogId];

        if (targetMarker && clusterGroup) {
            // CASE A: Marker Found!
            console.log("📍 Instant Hit! Zooming to marker.");
            // zoomToShowLayer handles unclustering AND opening popup
            clusterGroup.zoomToShowLayer(targetMarker, function() {
                targetMarker.openPopup();
            });
        } else {
            // CASE B: Marker not in index (filtered out?) -> Fallback
            console.log("✈️ Marker not in index. Flying to coordinates.");
            if (dogInfo && dogInfo.coords) {
                mapObj.flyTo(dogInfo.coords, 18, { animate: true, duration: 1.0 });
            }
        }
    }

    // 6. Search Bar Logic
    const searchInput = document.getElementById('mapSearch');
    const resultsDiv = document.getElementById('mapSearchResults');

    searchInput.addEventListener('keyup', function(e) {
        let filter = e.target.value.trim().toUpperCase();
        resultsDiv.innerHTML = '';
        
        if (filter.length < 2) {
            resultsDiv.style.display = 'none';
            return;
        }

        let matches = mapDogData.filter(dog => 
            dog.name.toUpperCase().includes(filter) || 
            String(dog.id).includes(filter)
        );
        
        if (matches.length > 0) {
            resultsDiv.style.display = 'block';
            matches.slice(0, 8).forEach(dog => {
                let div = document.createElement('div');
                div.style.padding = '8px';
                div.style.cursor = 'pointer';
                div.style.borderBottom = '1px solid #30363d';
                div.innerText = `${dog.name} (${dog.id})`;
                
                div.onmouseover = () => div.style.background = '#21262d';
                div.onmouseout = () => div.style.background = 'transparent';
                
                div.onclick = () => {
                    focusDog(dog.id);
                    resultsDiv.style.display = 'none';
                };
                resultsDiv.appendChild(div);
            });
        } else {
            resultsDiv.style.display = 'none';
        }
    });
