    // 2. Global State
    let mapObj = null;
    let clusterGroup = null;
    // FAST Lookup: "41.12345,-87.12345" -> [MarkerObject, ...]
    let locationIndex = {}; 

    // 3. Fast Initialization
    let initAttempts = 0;
    const initInterval = setInterval(() => {
        findMapComponents();
        
        if (mapObj && clusterGroup) {
            // Wait for Leaflet to actually process the markers
            if (clusterGroup.getLayers().length > 0) {
                console.log("✅ CACC Map: Ready. Building Spatial Index...");
                clearInterval(initInterval);
                
                // O(N) but extremely fast (float math only)
                buildLocationIndex();
                
                // Execute Deep Link if present
                checkUrlParams(); 
                return;
            }
        }
        
        initAttempts++;
        if (initAttempts > 50) { // 5 seconds timeout
            console.warn("⚠️ CACC Map: Timeout waiting for markers.");
            clearInterval(initInterval);
            // Attempt fallback even if indexing failed
            if (mapObj) checkUrlParams();
        }
    }, 100);

    function findMapComponents() {
        for(let key in window) {
            if (window[key] instanceof L.Map) {
                mapObj = window[key];
                break;
            }
        }
        if (mapObj) {
            mapObj.eachLayer(function(layer) {
                if (layer.zoomToShowLayer && layer.getAllChildMarkers) {
                    clusterGroup = layer;
                }
            });
        }
    }

    // 4. The Spatial Indexer
    function buildLocationIndex() {
        if (!clusterGroup) return;
        
        const markers = clusterGroup.getAllChildMarkers();
        markers.forEach(marker => {
            const ll = marker.getLatLng();
            // Create a key matching the Python precision (5 decimals)
            const key = `${ll.lat.toFixed(5)},${ll.lng.toFixed(5)}`;
            
            if (!locationIndex[key]) locationIndex[key] = [];
            locationIndex[key].push(marker);
        });
        console.log(`📚 Indexed ${markers.length} markers by location.`);
    }

    // 5. Deep Linking & Action Logic
    function checkUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const dogId = urlParams.get('id');
        if (dogId) {
            focusDog(dogId);
        }
    }

    function focusDog(dogId) {
        if (!mapObj) return;

        // A. Find Data
        const dogInfo = mapDogData.find(d => String(d.id) === String(dogId));
        if (!dogInfo) {
            console.warn("Dog ID not found in data:", dogId);
            return;
        }

        document.getElementById('mapSearch').value = `${dogInfo.name} (${dogInfo.id})`;

        // B. Find Marker via Location Index (O(1))
        let targetMarker = null;
        if (dogInfo.coords && locationIndex) {
            // Reconstruct the key: "lat,lon"
            const key = `${dogInfo.coords[0].toFixed(5)},${dogInfo.coords[1].toFixed(5)}`;
            const candidates = locationIndex[key];
            
            if (candidates) {
                // If multiple dogs at same address, find the one with the correct ID
                targetMarker = candidates.find(m => {
                    const popup = m.getPopup();
                    if (!popup) return false;
                    const content = popup.getContent();
                    const html = (typeof content === 'string') ? content : content.innerHTML;
                    return html && html.includes(`marker-dog-${dogId}`);
                });
                
                // Fallback: If strict ID match fails (rare), take the first one at location
                if (!targetMarker && candidates.length > 0) targetMarker = candidates[0];
            }
        }

        // C. Execute
        if (targetMarker && clusterGroup) {
            console.log("📍 Marker found via index. Zooming.");
            // This guarantees the popup opens, even if clustered
            clusterGroup.zoomToShowLayer(targetMarker, function() {
                targetMarker.openPopup();
            });
        } else {
            console.log("✈️ Marker object not found. Using Coordinate Fallback.");
            if (dogInfo.coords) {
                mapObj.flyTo(dogInfo.coords, 18, { animate: true, duration: 1.0 });
            }
        }
    }

    // 6. Search Bar Logic
    const searchInput = document.getElementById('mapSearch');
    const resultsDiv = document.getElementById('mapSearchResults');

    searchInput.addEventListener('keyup', function(e) {
        let filter = e.target.value.trim().toUpperCase();
        resultsDiv.innerHTML = '';
        
        if (filter.length < 2) {
            resultsDiv.style.display = 'none';
            return;
        }

        let matches = mapDogData.filter(dog => 
            dog.name.toUpperCase().includes(filter) || 
            String(dog.id).includes(filter)
        );
        
        if (matches.length > 0) {
            resultsDiv.style.display = 'block';
            matches.slice(0, 8).forEach(dog => {
                let div = document.createElement('div');
                div.style.padding = '8px';
                div.style.cursor = 'pointer';
                div.style.borderBottom = '1px solid #30363d';
                div.innerText = `${dog.name} (${dog.id})`;
                
                div.onmouseover = () => div.style.background = '#21262d';
                div.onmouseout = () => div.style.background = 'transparent';
                
                div.onclick = () => {
                    focusDog(dog.id);
                    resultsDiv.style.display = 'none';
                };
                resultsDiv.appendChild(div);
            });
        } else {
            resultsDiv.style.display = 'none';
        }
    });
