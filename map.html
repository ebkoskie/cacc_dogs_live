    // Optimization: Debounce Utility (Local scope since we don't extend base.html)
    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            const context = this;
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(context, args), wait);
        };
    }

    // Optimization: "Just-in-Time" Connection Warmer
    // Adapted for Map: Triggers preconnect to 24PetConnect on pin hover/tap
    (function() {
        let pcWarmed = false;

        function warmConnection() {
            if (pcWarmed) return;
            const link = document.createElement('link');
            link.rel = 'preconnect';
            link.href = 'https://24petconnect.com';
            // No crossorigin needed for simple navigation
            document.head.appendChild(link);
            pcWarmed = true;
        }

        const handleInteraction = (e) => {
            // Check if we are hovering/touching a link inside a Leaflet popup
            const link = e.target.closest('a[href*="24petconnect.com"]');
            if (!pcWarmed && link) {
                warmConnection();
            }
        };

        document.addEventListener('mouseover', handleInteraction, { passive: true });
        document.addEventListener('touchstart', handleInteraction, { passive: true });
    })();

    // Global State
    let mapObj = null;
    let dogCluster = null;
    let markerIndex = {}; 
    let mapDogData = [];

    // 1. Load Compressed Data
    fetch('map_data.json')
        .then(response => response.json())
        .then(payload => {
            const breeds = payload.breeds;
            
            // HYDRATION: Convert Array-of-Arrays back to Objects for the map logic
            // Schema: [id, name, breed_idx, gender_short, lat, lon, found_at]
            mapDogData = payload.data.map(row => ({
                id: row[0],
                name: row[1],
                breed: breeds[row[2]] || "Unknown",
                gender: row[3], // "Male", "Female", "Neutered Male", etc. (Shortened in backend)
                coords: [row[4], row[5]],
                found_at: row[6],
                url: `https://24petconnect.com/chgoall/Details/CHGO/${row[0]}`
            }));
            
            console.log(`✅ Data: Loaded ${mapDogData.length} records.`);
            // No initMapLayer call here; we rely on the interval below to detect when Folium is ready
        })
        .catch(err => console.error("Failed to load map data:", err));

    // 2. Wait for Folium Map
    const initInterval = setInterval(() => {
        for(let key in window) {
            if (window[key] instanceof L.Map) {
                mapObj = window[key];
                break;
            }
        }
        // Only render if map exists AND data is loaded
        if (mapObj && mapDogData.length > 0) {
            clearInterval(initInterval);
            renderPins();
        }
    }, 100);

    // 3. Render Pins
    function renderPins() {
        console.time("RenderPins");
        dogCluster = L.markerClusterGroup({ maxClusterRadius: 50, spiderfyOnMaxZoom: true, showCoverageOnHover: false });

        mapDogData.forEach(dog => {
            const popupHtml = `
                <div style="width:200px; font-family: sans-serif;">
                    <b style="font-size:1.1em">
                        <a href="${dog.url}" rel="noopener noreferrer" style="text-decoration:none; color:#0969da;">${dog.name}</a>
                    </b>
                    <span style="color:#666; font-size:0.9em">(${dog.id})</span><br>
                    <div style="margin-top:4px; font-size:0.9em; color:#333;">
                        ${dog.breed}<br>
                        ${dog.gender}<br>
                        <i style="color:#555; display:block; margin-top:4px; font-size:0.85em">${dog.found_at}</i>
                    </div>
                </div>`;

            const icon = L.AwesomeMarkers.icon({ icon: 'paw', prefix: 'fa', markerColor: 'blue', iconColor: 'white' });
            const marker = L.marker(dog.coords, { icon: icon }).bindPopup(popupHtml);

            dogCluster.addLayer(marker);
            markerIndex[dog.id] = marker;
        });

        mapObj.addLayer(dogCluster);
        console.timeEnd("RenderPins");
        enableUI();
    }

    function enableUI() {
        const searchBox = document.getElementById('mapSearch');
        searchBox.disabled = false;
        
        const urlParams = new URLSearchParams(window.location.search);
        const dogId = urlParams.get('id');
        if (dogId) focusDog(dogId);
    }

    // 4. Action Logic
    function focusDog(dogId) {
        const dogInfo = mapDogData.find(d => String(d.id) === String(dogId));
        if (!dogInfo) { alert(`⚠️ Could not locate Dog ${dogId}.`); return; }

        document.getElementById('mapSearch').value = `${dogInfo.name} (${dogInfo.id})`;
        const marker = markerIndex[dogId];
        
        if (marker) {
            dogCluster.zoomToShowLayer(marker, function() { marker.openPopup(); });
        } else {
            mapObj.flyTo(dogInfo.coords, 18);
        }
    }

    // 5. Search Bar Logic
    const searchInput = document.getElementById('mapSearch');
    const resultsDiv = document.getElementById('mapSearchResults');

    // Debounced Search Handler
    const handleMapSearch = debounce(function(e) {
        let filter = e.target.value.trim().toUpperCase();
        resultsDiv.innerHTML = '';
        
        if (filter.length < 2) { resultsDiv.style.display = 'none'; return; }

        let matches = mapDogData.filter(dog => 
            dog.name.toUpperCase().includes(filter) || String(dog.id).includes(filter)
        );
        
        if (matches.length > 0) {
            resultsDiv.style.display = 'block';
            matches.slice(0, 8).forEach(dog => {
                let div = document.createElement('div');
                div.className = 'search-result-item';
                div.innerText = `${dog.name} (${dog.id})`;
                div.onclick = () => { focusDog(dog.id); resultsDiv.style.display = 'none'; };
                resultsDiv.appendChild(div);
            });
        } else {
            resultsDiv.style.display = 'none';
        }
    }, 300);

    searchInput.addEventListener('keyup', handleMapSearch);
</script></body><script>
