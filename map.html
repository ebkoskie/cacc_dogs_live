    // 3. Robust Initialization Loop
    let initAttempts = 0;
    const initInterval = setInterval(() => {
        findMapComponents();
        // We only strictly need mapObj to function (for the fallback).

        if (mapObj) {
            console.log("✅ CACC Map: Map instance found.");
            if (clusterGroup) console.log("✅ CACC Map: Cluster Group found.");
            
            clearInterval(initInterval);
            checkUrlParams(); // Run deep link logic immediately after init
        } else {
            initAttempts++;
            if (initAttempts > 10) { 
                console.warn("⚠️ CACC Map: Could not bind to Leaflet map instance.");
                clearInterval(initInterval);
            }
        }
    }, 500);

    function findMapComponents() {
        // Find Leaflet Map
        for(let key in window) {
            if (window[key] instanceof L.Map) {
                mapObj = window[key];
                break;
            }
        }
        
        if (mapObj) {
            // Find Cluster Layer
            mapObj.eachLayer(function(layer) {
                if (layer.zoomToShowLayer && layer.getAllChildMarkers) {
                    clusterGroup = layer;
                }
            });
        }
    }

    // 4. Deep Linking & Search Logic
    function checkUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const dogId = urlParams.get('id');
        if (dogId) {
            focusDog(dogId);
        }
    }

    function focusDog(dogId) {
        if (!mapObj) return;

        // 1. Find Dog Data
        // Handle potential string/int mismatches
        const dogInfo = mapDogData.find(d => String(d.id) === String(dogId));
        
        if (!dogInfo) {
            console.warn("Dog ID not found in map data:", dogId);
            return;
        }

        // Update Search Box UI
        document.getElementById('mapSearch').value = `${dogInfo.name} (${dogInfo.id})`;

        // 2. Try to find the specific marker object (to pop it open)
        let targetMarker = null;

        if (clusterGroup) {
            const markers = clusterGroup.getAllChildMarkers();
            targetMarker = markers.find(marker => {
                const popup = marker.getPopup();
                if (!popup) return false;
                
                let content = popup.getContent();
                // Handle Leaflet returning HTMLElement
                if (typeof content !== 'string' && content.innerHTML) {
                    content = content.innerHTML;
                }
                
                // Flexible match for the hidden ID span
                // Matches: marker-dog-12345 (ignoring quotes to be safe)
                return content && content.includes(`marker-dog-${dogId}`);
            });
        }

        // 3. EXECUTE MOVEMENT
        if (targetMarker && clusterGroup) {
            // Best Case: Uncluster and open popup
            console.log("📍 Marker found, zooming to layer.");
            clusterGroup.zoomToShowLayer(targetMarker, function() {
                targetMarker.openPopup();
            });
        } else {
            // Fallback Case: Just fly to the coordinates!
            // This ensures the user ALWAYS sees the location, even if popup scraping fails.
            console.log("✈️ Marker object not found, using coordinate fallback.");
            if (dogInfo.coords) {
                mapObj.flyTo(dogInfo.coords, 18, {
                    animate: true,
                    duration: 1.5
                });
            }
        }
    }

    // 5. Search Bar Interaction
    const searchInput = document.getElementById('mapSearch');
    const resultsDiv = document.getElementById('mapSearchResults');

    searchInput.addEventListener('keyup', function(e) {
        let filter = e.target.value.trim().toUpperCase();
        resultsDiv.innerHTML = '';
        
        if (filter.length < 2) {
            resultsDiv.style.display = 'none';
            return;
        }

        let matches = mapDogData.filter(dog => 
            dog.name.toUpperCase().includes(filter) || 
            String(dog.id).includes(filter)
        );
        
        if (matches.length > 0) {
            resultsDiv.style.display = 'block';
            matches.slice(0, 8).forEach(dog => {
                let div = document.createElement('div');
                div.style.padding = '8px';
                div.style.cursor = 'pointer';
                div.style.borderBottom = '1px solid #30363d';
                div.innerText = `${dog.name} (${dog.id})`;
                
                div.onmouseover = () => div.style.background = '#21262d';
                div.onmouseout = () => div.style.background = 'transparent';
                
                div.onclick = () => {
                    focusDog(dog.id);
                    resultsDiv.style.display = 'none';
                };
                resultsDiv.appendChild(div);
            });
        } else {
            resultsDiv.style.display = 'none';
        }
    });
