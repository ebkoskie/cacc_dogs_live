    // Load search index
    let dogLocations = {}; // Map Name -> Lat/Lon
    
    // We need to wait for the map to initialize to access markers.
    // However, Folium markers aren't easily searchable by ID globally.
    // Strategy: We will fetch the search_index, but we also need coordinates.
    // Since search_index.json doesn't have coords, we might need to rely on the Popup text content 
    // OR we can just simple-search the Leaflet markers if possible.
    
    // BETTER APPROACH: Iterate over Leaflet layers to build a local index of visible markers
    // This runs after map load
    window.addEventListener('load', function() {
        setTimeout(() => {
            // Find the map object (Folium usually names it 'map_someRandomId')
            // We can find it by looking for the global variable that is an instance of L.Map
            let mapObj = null;
            for(let key in window) {
                if (window[key] instanceof L.Map) {
                    mapObj = window[key];
                    break;
                }
            }

            if(!mapObj) return;

            // Build index from markers
            mapObj.eachLayer(function(layer) {
                if (layer instanceof L.Marker && layer.getPopup()) {
                    // Extract name from popup HTML (crude but effective for Folium)
                    let content = layer.getPopup().getContent();
                    // Content format: <b><a href="...">Name</a></b>
                    let parser = new DOMParser();
                    let doc = parser.parseFromString(content, 'text/html');
                    let a = doc.querySelector('a');
                    
                    if (a) {
                        let name = a.innerText.toUpperCase();
                        dogLocations[name] = layer;
                    }
                }
            });
        }, 1000); // Give Folium time to init
    });

    // Search Logic
    const searchInput = document.getElementById('mapSearch');
    const resultsDiv = document.getElementById('mapSearchResults');

    searchInput.addEventListener('keyup', function(e) {
        let filter = e.target.value.toUpperCase();
        resultsDiv.innerHTML = '';
        
        if (filter.length < 2) {
            resultsDiv.style.display = 'none';
            return;
        }

        let matches = Object.keys(dogLocations).filter(name => name.includes(filter));
        
        if (matches.length > 0) {
            resultsDiv.style.display = 'block';
            matches.slice(0, 5).forEach(name => {
                let div = document.createElement('div');
                div.style.padding = '8px';
                div.style.cursor = 'pointer';
                div.style.borderBottom = '1px solid #30363d';
                div.innerText = name;
                div.onmouseover = () => div.style.background = '#21262d';
                div.onmouseout = () => div.style.background = 'transparent';
                
                div.onclick = () => {
                    let marker = dogLocations[name];
                    // Find map object again
                    for(let key in window) {
                        if (window[key] instanceof L.Map) {
                            let map = window[key];
                            // Zoom to marker and open popup
                            // If it's in a cluster, we might need to zoom closer first
                            map.flyTo(marker.getLatLng(), 15);
                            
                            // Allow time for zoom/cluster expansion
                            setTimeout(() => {
                                marker.openPopup();
                            }, 500);
                            break;
                        }
                    }
                    resultsDiv.style.display = 'none';
                    searchInput.value = name;
                };
                resultsDiv.appendChild(div);
            });
        } else {
            resultsDiv.style.display = 'none';
        }
    });
